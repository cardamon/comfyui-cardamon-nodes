description = "Custom nodes for ComfyUI."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/cardamon/comfyui-cardamon-nodes"

[tool.comfy]
